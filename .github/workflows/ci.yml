name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # 运行依赖锁 = requirements.txt 的运行闭包（按 linux/cp311 解析，含 wheel 可用性校验）；
        # 它不等于 requirements.lock（那是含 torch/CUDA/pywin32 的整机训练快照）
        run: pip install -r requirements-runtime.lock
      - name: Install CJK fonts (PDF tests)
        # DroidSansFallbackFull.ttf 是真 TrueType（report_pdf 完整支持中文）；
        # Noto CJK / wqy 多为 TTC/CFF，report_pdf 会跳过（回退 Helvetica）
        run: sudo apt-get update && sudo apt-get install -y fonts-droid-fallback
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Compile all Python files
        # core.quotepath=false：仓库含中文路径（标准/course_core/...），
        # git 默认八进制转义输出导致 py_compile 收到字面量转义串而失败
        run: python -m py_compile $(git -c core.quotepath=false ls-files '*.py')
      - name: Unit tests
        run: python test_common.py
      - name: Orchestrator regression tests
        run: python test_orchestrator_v2.py
      - name: Delivery chain regression tests
        run: python test_delivery_chain.py
      - name: Prompt system tests
        run: python test_prompt_system.py
      - name: Setup wizard tests
        run: python test_setup_wizard.py
      - name: P0/P1 regression tests
        run: python test_p0.py
      - name: Acceptance adversarial suite
        run: python test_acceptance_adversarial.py
      - name: Sandbox isolation tests
        run: python test_sandbox_isolation.py
      - name: Metrics scope tests
        run: python test_metrics_scope.py
      - name: Frontend invariants (source-level guards)
        run: python test_frontend_guards.py
      - name: Startup readiness (cold-start race)
        run: python test_startup_readiness.py
      - name: Task context contract (identity across threads/processes)
        run: python test_task_context.py
      - name: Network access policy (registered endpoints vs content URLs)
        run: python test_net_policy.py
      - name: Report version selection & source semantics (V1 fixed samples)
        run: python test_report_quality.py
      - name: Report version & evidence binding (M0-a)
        run: python test_report_version.py
      - name: Cancel semantics (terminal state / gate / bounded wait)
        run: python test_cancel_semantics.py
      - name: Review degradation (timeout/exception must not pass)
        run: python test_review_degradation.py
      - name: Review protocol & per-root-task state (M0-b)
        run: python test_review_protocol.py
      - name: Admission for lessons/templates/refinery (M0-d)
        run: python test_admission.py
      - name: R0 boundaries (goal-vs-evidence, operand roles)
        run: python test_r0_boundaries.py
      - name: "Review/pending-review isolation (R1 - bound PASS, RAG gate, claim)"
        run: python test_review_isolation.py
      - name: Search quality unified (single impl + configurable policy)
        run: python test_search_quality_unified.py
      - name: "Fact fidelity across layers (S1: subject / currency / unit / clean attribution)"
        run: python test_fact_fidelity.py
      - name: Portable Redis acquisition (multi-source / budget / offline reuse)
        run: python test_redis_acquisition.py
      - name: US financial chain (SEC fixture / subject extraction / amount rate)
        run: python test_us_chain.py
      - name: Root-task budget & stage observability (M0-e / R2 tickets)
        run: python test_root_budget.py
      - name: Offline delivery & fault injection (M0-f)
        run: python test_offline_delivery.py
      - name: Deploy manifest & lock guards
        run: python test_deploy_manifest.py
      - name: Task state tests
        run: python test_task_state.py
      - name: Task persistence & db path tests
        run: python test_task_persistence.py
      - name: Task projection tests
        run: python test_task_projection.py
      - name: Writer consolidation tests
        run: python test_writer_consolidation.py
      - name: Checkpoint tests
        run: python test_checkpointer.py
      - name: Financial chain tests
        run: python test_financial_chain.py
      - name: Memory degradation tests
        run: python test_memory_degradation.py
      - name: Auth & audit tests
        run: python test_auth_audit.py
      - name: Isolation scope tests
        run: python test_isolation_scope.py
      - name: LoRA manager tests
        run: python test_lora_manager.py
      - name: Notification tests
        run: python test_notifications.py
      - name: Settings requirements tests
        run: python test_settings_requirements.py
      - name: Task time optimization tests
        run: python test_task_time_optimization.py
      - name: Skills & validators check
        run: python -c "from skill_registry import list_skills; assert len(list_skills())>=3; from validators.registry import list_validators; assert len(list_validators())>=4"
      - name: Eval cases schema check
        run: python -m evals.run --dry-run
      - name: Deterministic eval gate
        run: python -m evals.gate_ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 行为测试直接跑 .ts（Node 的类型擦除需要 22.6+；本地用 24 验证过）
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Behavior tests (demo guard / API result / metrics state)
        # 真实行为测试：用内存 fetch 替身断言"请求有没有真的发出去""失败/拦截有没有被当成成功"，
        # 不依赖浏览器与真实接口
        run: node --experimental-strip-types --test tests/*.test.mjs
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  clean-env-e2e:
    # **部署烟测（固定模型替身）**：从**提交内容**克隆 → 装依赖 → 起服务 → 提交任务 →
    # 产出**夹具预期**的报告，外加一条负向用例（替身注入故障 → 任务必须如实失败，
    # 且成功判据必须拒绝它的文本）。
    #
    # 这条闸门证明与不证明什么（写清口径，别把绿当成金融质量）：
    #   证明：干净检出可安装、依赖自检通过、服务能就绪、任务能到成功终态、
    #         交付物含夹具标记与夹具事实（不是"文本非空"）。
    #   不证明：真实模型质量、真实 SEC/行情抓取、金融数字正确性——那是 S1/S2 的单独关卡。
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-runtime.lock
      - name: Install CJK fonts (PDF export path)
        run: sudo apt-get update && sudo apt-get install -y fonts-droid-fallback
      - name: "Deployment smoke (stub model: clone → deps → start → task → fixture report + negative case)"
        run: python scripts/e2e_clean_check.py --ci --timeout 900
      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-clean-last
          path: docs/evidence/e2e_clean_last.json
          if-no-files-found: warn

  docker-image:
    # 镜像此前"看着能构建、其实起不来"：编排器由 launcher 以子进程拉起，缺 charts_pipeline
    # 等包即导入崩溃，而 CI 既不构建镜像也不做导入检查。这里把"能起"变成可验证的闸门。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compose env file
        # compose 的 LLM_API_KEY 是必填插值变量（:? 语法），构建阶段解析文件时就要有值；
        # 这里给占位值，仅为验证镜像能构建、服务能就绪
        run: printf 'LLM_API_KEY=ci-dummy-key\n' > .env
      - name: Build image
        run: docker compose build app
      - name: Import check — 编排器与 API 层
        run: |
          docker compose run --rm --no-deps app python -c \
            "import orchestrator_v2, web_ui, launcher, metrics_collector, db_paths, data_paths, charts_pipeline, structured_pipeline, adapters, validators"
      - name: Import check — 全部 worker
        run: |
          docker compose run --rm --no-deps app python -c "
          import importlib.util, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path('workers').glob('*.py')):
              spec = importlib.util.spec_from_file_location(p.stem, p)
              mod = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(mod)
              except Exception as exc:
                  bad.append((p.name, type(exc).__name__, str(exc)[:120]))
          print('workers imported:', len(list(pathlib.Path('workers').glob('*.py'))))
          assert not bad, bad
          "
      - name: Compose up and readiness check
        run: |
          docker compose up -d
          code=""
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health || true)
            if [ "$code" = "200" ]; then echo "ready after ${i} tries"; break; fi
            sleep 5
          done
          docker compose ps || true
          docker compose logs --tail=60 || true
          docker compose down -v || true
          test "$code" = "200"
