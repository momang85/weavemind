name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install CJK fonts (PDF tests)
        # wqy-microhei 是 TrueType 轮廓（report_pdf 支持）；Noto CJK 是 CFF 轮廓会被跳过
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Compile all Python files
        run: python -m py_compile $(git ls-files '*.py')
      - name: Unit tests
        run: python test_common.py
      - name: Orchestrator regression tests
        run: python test_orchestrator_v2.py
      - name: Delivery chain regression tests
        run: python test_delivery_chain.py
      - name: Prompt system tests
        run: python test_prompt_system.py
      - name: P0/P1 regression tests
        run: python test_p0.py
      - name: Skills & validators check
        run: python -c "from skill_registry import list_skills; assert len(list_skills())>=3; from validators.registry import list_validators; assert len(list_validators())>=4"
      - name: Eval cases schema check
        run: python -m evals.run --dry-run
      - name: Deterministic eval gate
        run: python -m evals.gate_ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
