name: zhiguan

services:
  redis:
    image: redis:7-alpine
    container_name: zhiguan-redis
    # C2：开启 AOF（appendonly yes），保留默认 RDB 的同时容器重启不丢队列数据
    command: ["redis-server", "--appendonly", "yes"]
    # P1-2：不对外映射 host 端口。Redis 仅对 compose 内部网络可达（app 通过
    # REDIS_HOST=redis 连接），避免可到达部署主机的攻击者直连 Redis 读写队列。
    # 如需从宿主机调试，可临时用 `docker exec -it zhiguan-redis redis-cli`。
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: zhiguan-app
    depends_on:
      - redis
    environment:
      # 密钥通过 .env（与 docker-compose.yml 同目录）注入，不写入镜像
      - LLM_API_KEY=${LLM_API_KEY:?请在 .env 中设置 LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-ai/DeepSeek-V3}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-${LLM_API_KEY}}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-${LLM_BASE_URL}}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    volumes:
      - app_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  app_data:
