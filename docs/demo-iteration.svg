<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      .node { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 14; }
      .label { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .sub { fill: #64748b; font-size: 11px; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
      .arrow-ok { stroke: #34d399; stroke-width: 2; fill: none; }
      .arrow-loop { stroke: #fbbf24; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: dash 0.8s linear infinite; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      .iter-dot { fill: #7c3aed; opacity: 0.9; }
      .iter-text { fill: #c4b5fd; font-size: 12px; font-weight: 600; }
      .ok-text { fill: #34d399; font-size: 13px; font-weight: 700; }
      .loop-text { fill: #fbbf24; font-size: 13px; font-weight: 700; }
    </style>
  </defs>
  <rect width="900" height="440" rx="18" fill="#0b1120"/>
  <text x="28" y="36" fill="#38bdf8" font-size="18" font-weight="700">自主迭代模式（Autonomous Iteration）</text>
  <text x="28" y="58" fill="#64748b" font-size="12">执行 → 验收评审 → 不达标自动追加步骤，直到通过或达到上限（max_iterations）</text>

  <!-- 第一行节点 -->
  <g>
    <rect class="node" x="40" y="90" width="150" height="60"/>
    <text class="label" x="115" y="116" text-anchor="middle">用户目标</text>
    <text class="sub" x="115" y="136" text-anchor="middle">Goal</text>

    <rect class="node" x="250" y="90" width="150" height="60"/>
    <text class="label" x="325" y="116" text-anchor="middle">规划</text>
    <text class="sub" x="325" y="136" text-anchor="middle">LLM Plan</text>

    <rect class="node" x="460" y="90" width="150" height="60"/>
    <text class="label" x="535" y="116" text-anchor="middle">并行执行</text>
    <text class="sub" x="535" y="136" text-anchor="middle">Workers DAG</text>

    <rect class="node" x="670" y="90" width="180" height="60"/>
    <text class="label" x="760" y="116" text-anchor="middle">验收评审</text>
    <text class="sub" x="760" y="136" text-anchor="middle">Reflect</text>
  </g>

  <!-- 主线箭头 -->
  <line class="arrow" x1="190" y1="120" x2="248" y2="120"/>
  <line class="arrow" x1="400" y1="120" x2="458" y2="120"/>
  <line class="arrow" x1="610" y1="120" x2="668" y2="120"/>

  <!-- 第二行节点 -->
  <g>
    <rect class="node" x="460" y="330" width="150" height="60"/>
    <text class="label" x="535" y="356" text-anchor="middle">追加步骤</text>
    <text class="sub" x="535" y="376" text-anchor="middle">Next Steps</text>

    <rect class="node" x="670" y="330" width="180" height="60"/>
    <text class="label" x="760" y="356" text-anchor="middle">最终报告</text>
    <text class="sub" x="760" y="376" text-anchor="middle">Deliverable</text>
  </g>

  <!-- 通过分支：评审 -> 最终报告 -->
  <line class="arrow-ok" x1="760" y1="150" x2="760" y2="328"/>
  <circle class="pulse" cx="760" cy="240" r="5" fill="#34d399"/>
  <text class="ok-text" x="775" y="244">通过 Accepted</text>

  <!-- 未通过分支：评审 -> 追加步骤（循环回执行） -->
  <path class="arrow-loop" d="M 680 150 C 620 200, 580 250, 535 328"/>
  <text class="loop-text" x="560" y="235">未通过 → 追加步骤</text>
  <line class="arrow-loop" x1="535" y1="330" x2="535" y2="152"/>

  <!-- 迭代轮次指示 -->
  <g>
    <circle class="iter-dot pulse" cx="130" cy="330" r="14" style="animation-delay:0s"/>
    <text class="iter-text" x="130" y="335" text-anchor="middle">0</text>
    <circle class="iter-dot pulse" cx="210" cy="330" r="14" style="animation-delay:0.5s"/>
    <text class="iter-text" x="210" y="335" text-anchor="middle">1</text>
    <circle class="iter-dot pulse" cx="290" cy="330" r="14" style="animation-delay:1s"/>
    <text class="iter-text" x="290" y="335" text-anchor="middle">2</text>
    <text x="210" y="375" fill="#64748b" font-size="12" text-anchor="middle">迭代轮次 · 前端显示「第 N 轮」徽标</text>
  </g>
</svg>
